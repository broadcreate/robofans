project_2:
  title: "粒径视觉分析系统"
  description: "高速公路建设中的路基摊铺粒径合规监测系统，利用视觉分析技术实时监控粒径，确保路基建设符合标准。系统为施工过程提供即时反馈，帮助优化施工质量。"
  features:
    - "实时粒径合规监测"
    - "高速公路建设过程中的质量控制"
    - "数据可视化与分析"
  url: "/project/particle-size-analysis"

project_3:
  title: "料仓颗粒料余料测量系统"
  description: "一种基于传感器和图像处理技术的实时料仓颗粒料余料测量系统，通过实时数据采集与分析，提供精确的余料量监测，支持施工现场的物料管理与调度。"
  features:
    - "实时料仓余料测量"
    - "颗粒料物料管理优化"
    - "高精度测量与数据分析"
  url: "/project/material-measurement-system"
