  avatar: "/assets/images/Icon/web/icon-512.png" # path of avatar image, e.g. "/assets/images/bio-photo.jpg"
  bio: "专注于智能化施工现场监测与控制技术的研发与应用，推动建设行业的智能化与安全管理。"
  location: "Chongqing, PRC"
  email:
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:robo@robofans.org"
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://www.robofans.org"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      # url: "https://twitter.com/"
    - label: "Facebook"
      icon: "fab fa-fw fa-facebook-square"
      # url: "https://facebook.com/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      # url: "https://github.com/"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      # url: "https://instagram.com/"
project_1:
  title: "施工现场监测系统"
  description: "基于视觉技术的智能施工现场监测系统，能够实时检测是否佩戴安全帽、是否穿着反光衣以及机械臂是否越界。系统通过视频监控与图像识别，确保施工安全并减少意外风险。"
  features:
    - "实时安全帽佩戴检测"
    - "实时反光衣穿戴监测"
    - "机械臂越界监测"
